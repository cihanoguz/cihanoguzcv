server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /cv.pdf {
        default_type application/pdf;
        add_header Content-Disposition "attachment; filename=\"Cihan_Oguz_CV.pdf\"";
        try_files /cv.pdf =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
